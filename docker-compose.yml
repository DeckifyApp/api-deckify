services:
  postgres:
    image: postgres:16-alpine
    container_name: deckify_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-deckify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deckify}
      POSTGRES_DB: ${POSTGRES_DB:-deckify}
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
    container_name: deckify_api
    restart: unless-stopped
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-deckify}:${POSTGRES_PASSWORD:-deckify}@postgres:5432/${POSTGRES_DB:-deckify}
      NODE_ENV: ${NODE_ENV:-development}
    ports:
      - '3333:3333'

volumes:
  postgres_data:
