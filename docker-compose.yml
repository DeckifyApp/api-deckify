services:
  postgres:
    image: postgres:16-alpine
    container_name: deckify_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: deckify
      POSTGRES_PASSWORD: deckify
      POSTGRES_DB: deckify
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
    container_name: deckify_api
    restart: unless-stopped
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://deckify:deckify@postgres:5432/deckify
    ports:
      - '3333:3333'
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npm install && npm run prisma:generate && npm run dev"

volumes:
  postgres_data:
